<!DOCTYPE html>
<html>
<head>
    <title>Network Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Network Devices</h1>
        <table class="table">
            <thead>
                <tr>
                    <th>IP</th>
                    <th>Status</th>
                    <th>Response Time</th>
                    <th>Country</th>
                    <th>ISP</th>
                </tr>
            </thead>
            <tbody>
                {% for device in results %}
                <tr class="{{ 'table-success' if device.Status == 'Online' else 'table-danger' }}">
                    <td>{{ device.IP }}</td>
                    <td>{{ device.Status }}</td>
                    <td>{{ device['Response Time (ms)'] }}</td>
                    <td>{{ device.Country }}</td>
                    <td>{{ device.ISP }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
